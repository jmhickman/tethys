# The container's LXC compatibility drop-in
# (/run/systemd/system/service.d/zzz-lxc-service.conf) forces
# StandardInput=null / StandardOutput=journal on every service, which
# breaks Accept=yes socket activation (gk-mcp would read /dev/null as
# stdin). /etc drop-ins take precedence over /run ones — restore the
# connection socket on stdio.
[Service]
StandardInput=socket
StandardOutput=socket
