[workspace]
resolver = "2"
members = ["crates/core", "crates/tethysd", "crates/tethys-mcp", "crates/tethys"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
# MSRV-001: floor the code actually needs (u64::is_multiple_of => 1.87).
# Deliberately no rust-toolchain.toml: there is no CI to consume it, and a
# pin would freeze dev machines too — declare the floor, don't freeze it.
rust-version = "1.87"

[workspace.dependencies]
tethys-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "io-std", "process"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ipnet = { version = "2", features = ["serde"] }
nix = { version = "0.29", features = ["user"] }
libc = "0.2"
toml = "0.8"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.4", features = ["transport-io"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"

# CARGOLINT-001: the root daemon is unsafe-free by policy. `deny` (not
# `forbid`) so the single audited umask guard can carry a scoped allow; any
# NEW unsafe fails the build until it gets that treatment.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# pedantic deliberately not enabled: ~100 pre-existing style lints would
# bury the signal; adopt incrementally if ever wanted.

[profile.dev]
debug = 0

# Security-relevant arithmetic must behave identically in both profiles:
# overflow panics (checked) instead of wrapping silently.
[profile.release]
overflow-checks = true
