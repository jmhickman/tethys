[workspace]
resolver = "2"
members = ["crates/core", "crates/gatekeeper", "crates/gk-mcp", "crates/gk-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
gk-core = { path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "io-std", "process"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ipnet = { version = "2", features = ["serde"] }
nix = { version = "0.29", features = ["user"] }
toml = "0.8"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rmcp = { version = "3.4", features = ["transport-io"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
unicode-width = "0.2"

[profile.dev]
debug = 0
